<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeabR - Registro</title>
    <link th:href="@{/css/login.css}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <img th:src="@{/images/logo_scaleX.png}" alt="SeabR Logo">
        </div>
        
        <div class="tagline">CREAR CUENTA</div>
        
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> USUARIO</label>
                <input type="text" id="username" th:field="*{username}" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> CORREO ELECTRONICO</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> CONTRASEÑA</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword"><i class="fas fa-lock"></i> CONFIRMAR CONTRASEÑA</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" required>
            </div>
            
            <button type="submit" class="btn-primary">REGISTRARSE</button>
        </form>
        
        <div class="login-link">
            ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia Sesión</a>
        </div>
    </div>
</body>
</html>
