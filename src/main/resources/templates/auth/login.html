<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeabR - Iniciar Sesión</title>
    <link th:href="@{/css/login.css}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img th:src="@{/images/logo_scalex.png}" alt="SeabR Logo">
        </div>
        
        <div class="tagline">COMPARE SIZES</div>
        
        <div class="divider"></div>
        
        <!-- Mensajes de error/success -->
        <div th:if="${param.error}" class="alert alert-error">
            Credenciales inválidas
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            Sesión cerrada exitosamente
        </div>
        <div th:if="${param.success}" class="alert alert-success">
            Registro exitoso. Por favor inicia sesión.
        </div>
        
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username"><i class="fas fa-envelope"></i> USUARIO</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> CONTRASEÑA</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn-primary">INICIAR SESION</button>
        </form>
        
        <div class="register-link">
            ¿No tienes cuenta? <a th:href="@{/register}">Registrate</a>
        </div>
    </div>
</body>
</html>
