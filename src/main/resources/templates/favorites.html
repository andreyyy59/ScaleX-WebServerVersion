<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeabR - Favoritos</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>

    <main class="main-content">
        <div class="container">
            <h1>Mis Motos Favoritas</h1>
            
            <div th:if="${favorites.empty}" class="empty-state">
                <i class="fas fa-heart"></i>
                <h3>No tienes motos favoritas</h3>
                <p>Agrega motos a tus favoritos desde la página de inicio</p>
                <a th:href="@{/home}" class="btn-primary">Explorar Motos</a>
            </div>

            <div th:unless="${favorites.empty}" class="favorites-grid">
                <div th:each="favorite : ${favorites}" class="favorite-card">
                    <div class="card-image">
                        <img th:src="${favorite.motorcycle.imageUrl}" 
                             th:alt="${favorite.motorcycle.make + ' ' + favorite.motorcycle.model}"
                             onerror="this.src='/images/motorcycles/default.jpg'">
                        <form th:action="@{/favorites/remove}" method="post" class="favorite-form">
                            <input type="hidden" name="motorcycleId" th:value="${favorite.motorcycle.id}">
                            <button type="submit" class="favorite-btn active">
                                <i class="fas fa-heart"></i>
                            </button>
                        </form>
                    </div>
                    <div class="card-content">
                        <h3 th:text="${favorite.motorcycle.make + ' ' + favorite.motorcycle.model}"></h3>
                        <p class="year" th:text="${favorite.motorcycle.year}"></p>
                        <p class="category" th:text="${favorite.motorcycle.category}"></p>
                        <div class="specs">
                            <span><i class="fas fa-tachometer-alt"></i> 
                                <span th:text="${favorite.motorcycle.engineSize + ' cc'}"></span>
                            </span>
                            <span><i class="fas fa-horse-head"></i> 
                                <span th:text="${favorite.motorcycle.power + ' HP'}"></span>
                            </span>
                            <span><i class="fas fa-weight"></i> 
                                <span th:text="${favorite.motorcycle.weight + ' kg'}"></span>
                            </span>
                        </div>
                        <div class="card-actions">
                            <a th:href="@{/search/similar(baseMotorcycleId=${favorite.motorcycle.id})}" 
                               class="btn-secondary">
                                Ver Similares
                            </a>
                            <button class="btn-compare" th:data-id="${favorite.motorcycle.id}">
                                Comparar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
